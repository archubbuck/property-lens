services:
  postgres:
    image: postgres:16-alpine
    container_name: property-lens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: propertylens
      POSTGRES_PASSWORD: propertylens_dev_only
      POSTGRES_DB: propertylens
    ports:
      - "5432:5432"
    volumes:
      - property-lens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propertylens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  property-lens-postgres-data:
